name: Test Bot

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only check the Metaculus token and list open bot-testing-area questions (no LLM, nothing posted)"
        type: boolean
        default: false

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
permissions:
  contents: read

jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Cached venv (gigbot): faster runs, fewer Actions minutes. The key includes the exact Python patch version:
      # a venv built on 3.11.x breaks when the runner image moves to 3.11.y (seen 2026-10-07: "virtual environment
      # ... seems to be broken", then ModuleNotFoundError). `poetry install` always runs; on a good cache it's a
      # few seconds, and on a broken or missing venv it rebuilds instead of silently skipping.
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      # Gemini daily call counter (gigbot): a tiny JSON file carried between runs by the cache. The restore key
      # never matches, so restore-keys picks the most recent `gemini-usage-*` entry; save always writes a new one.
      - name: Restore Gemini usage counter
        uses: actions/cache/restore@v4
        with:
          path: .gemini-usage
          key: gemini-usage-${{ github.run_id }}
          restore-keys: gemini-usage-
      - name: Run bot
        run: |
          poetry run python gigbot_bot.py --mode test_questions ${{ inputs.check_only && '--check-only' || '' }}
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_USAGE: ${{ vars.GEMINI_USAGE }} # optional manual override of the cached counter
          GEMINI_DAILY_CAP: ${{ vars.GEMINI_DAILY_CAP }}
          GEMINI_RPM: ${{ vars.GEMINI_RPM }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          FORECASTER_MODELS: ${{ vars.FORECASTER_MODELS }}
          RESEARCHER_MODEL: ${{ vars.RESEARCHER_MODEL }}
          PARSER_MODEL: ${{ vars.PARSER_MODEL }}
          PREDICTIONS_PER_QUESTION: ${{ vars.PREDICTIONS_PER_QUESTION }}
      - name: Save Gemini usage counter
        if: always() && hashFiles('.gemini-usage/usage.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .gemini-usage
          key: gemini-usage-${{ github.run_id }}
